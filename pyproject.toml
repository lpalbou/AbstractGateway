[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "abstractgateway"
version = "0.13.1"
description = "AbstractGateway: deployable Run Gateway host for AbstractRuntime (commands + ledger)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Laurent-Philippe Albou" }]

dependencies = [
  # workflow_sources reads the checkout's pyproject.toml (tomllib is stdlib from 3.11).
  "tomli>=1.1; python_version < '3.11'",
  # Floor = live_deltas.ABSTRACTRUNTIME_FLOOR (a test keeps them equal): live
  # token deltas with parent_run_id and the built-in tool deny prefixes
  # (runtime 6567ed4), which an older runtime would silently ignore; the host
  # refuses to start on a runtime without them. 0.5.1: a wait is resumed at
  # most once (a parent could run its Agent/subflow child twice otherwise).
  # 0.6.0: automations (abstractruntime.automations / automation_queries),
  # which the gateway imports unconditionally. 0.7.0: THE history window
  # (session_chat_messages replays the newest whole turns up to 50k tokens
  # and reports it; the message/char caps are gone) and the host-supplied
  # voice_openai_api_key threaded to AbstractVoice. 0.7.2: the local STT model
  # list names each engine's own models (the Voice screen's transcription
  # models) and Runtime depends on AbstractCore's three install settings.
  # 0.7.3: an explicitly loaded image or video model serves generation
  # in-process (the console Load button reuses the loaded pipeline instead of
  # reloading the model per request).
  # 0.8.0: per-user email (framework backlog 0992) — run binding + resolver `use`, durable event
  # inbox, email.received@1, the send-email action, the email facade, per-caller email toolsets.
  # 0.8.2: pausing an automation also stops its retries (the console's pause switch).
  # 0.9.0: automation.unarchive (archived automation back, paused, with its history) and the
  # archive contract the Accounts/session archive routes rely on.
  # 0.9.1: streamed speech is never a run wait (close_interrupted_voice_stream at boot) and
  # browser_probe local targets carry the run's sandbox stamp.
  "AbstractRuntime>=0.9.1",
  # Floor only (no extras; Runtime chooses them). The gateway relies on
  # AbstractCore 2.16.1 (abstractcore.utils.identity for the About rows,
  # process-wide model residency and eject semantics, host-job download
  # progress, the recommended text tiers, the MLX held-memory report; 2.16.1:
  # MLX prompts follow the model's chat template; 2.17.0: capability-default
  # rows carry route_unavailable / host-aware recommendation_unavailable, which
  # the consoles render; 2.18.0: engine_missing routes and the needs_gpu_limit
  # fit verdict, which the consoles render; 2.19.1: the Linux + NVIDIA
  # recommendations the first-run guide shows, LM Studio's @q4_k_m download and
  # Diffusers FLUX.2 [klein] 4B on CUDA, and speech-to-text on the configured
  # input.voice route; 2.19.2: speech input in the fresh-install seed
  # (recommended-v2) and apply-recommended --only stt, which the consoles
  # render); Runtime alone would keep an older Core on upgrade.
  # 2.20.0: the mail library (abstractcore.comms.email: account store, vault, OAuth, verified TLS,
  # recipient policy and send limits) behind the runtime's email facade.
  # 2.22.0: mailbox server discovery (abstractcore.comms.email discover_servers /
  # server_defaults) and the account store's set_folder, which mail/core_mail.py imports.
  # 2.24.0: request-scoped Core server auth for the managed /core/v1 endpoint.
  # 2.25.0: structured outputs (response_format json_object/json_schema) at /v1, 404 for an
  # unknown provider, per-quant GGUF and repo-scoped cache delete (Models page Delete).
  # 2.25.1: the Linux sandbox reaches an allowed workspace inside a refused folder, and
  # browser_probe serves local pages from a loopback origin scoped to the run's workspaces.
  "abstractcore>=2.25.1",
  # Imported directly (routes/gateway.py voice listings):
  # abstractvoice.engine_runtime (0.13.0) decides which local voice engines
  # are available, and voice_openai_api_key (0.13.0) carries the Providers
  # screen's OpenAI key. Also reached through Runtime -> abstractcore[voice],
  # but that is three hops; the direct import gets a direct floor.
  # 0.14.0: streamed speech starts sooner (a short first segment) for the gateway's
  # /voice/tts/stream, and stream metrics report the execution device.
  "abstractvoice>=0.14.0",
  # 0.3.14: delegated sub-agents inherit the run's _runtime.stream switch.
  # 0.3.15: CodeAct/MemAct crash fix; re-prompt when a reply announces tool
  # calls it never makes. 0.3.17: entity visit react turns send the runtime's
  # history window (newest whole turns up to 50k tokens, ADR-0026). 0.3.18:
  # the agents' Python execution runs inside the run's command sandbox (round 12).
  # 0.3.19: ReAct repairs a rejected tool-call format (at most 2 retries per turn).
  "abstractagent>=0.3.19",
  "AbstractMemory[lancedb]>=0.3.0",
  # 0.3.0 ships the curated skill shelf inside the package (abstractskill.bundled)
  # and seed_registry, which the gateway uses to keep <data dir>/skills/registry.
  "abstractskill>=0.3.0",
  "requests<3.0.0,>=2.32.5",
  "urllib3<3.0.0,>=2.5.0",
  "fastapi<1.0.0,>=0.136.0",
  "python-multipart>=0.0.6",
  "uvicorn[standard]<1.0.0,>=0.38.0",
  # The apps are served through the gateway at /apps/<id>/ (app_proxy.py):
  # httpx relays HTTP (streaming, SSE), websockets relays WebSockets
  # (asyncio client API: 13.1+). Both were transitive; declared because they
  # are load-bearing.
  "httpx<1.0.0,>=0.28.1",
  "websockets>=13.1",
  # Entity homes store the attested spark as YAML (spark.yaml). Previously
  # only transitive via uvicorn[standard]; declared because it is load-bearing.
  "pyyaml>=5.1",
]

[project.optional-dependencies]
# Supported install profiles.
# - Base install (`pip install abstractgateway`) is the remote-light HTTP/SSE server
#   with Runtime multimodal routing and MCP worker support.
# - `embeddings` enables local sentence-transformer embeddings for semantic KG queries.
# - `apple` / `gpu` select hardware-local stacks for the gateway host.
#
# Tooling extras for contributors: `dev`, `docs`.

embeddings = [
  "abstractcore[embeddings]>=2.25.1",
]

# Desktop tray / menu-bar icon shown by `abstractgateway serve` (macOS, Windows,
# Linux): open the console, pause/resume workflows, unload models, watch memory
# and GPU. pystray pulls pyobjc on macOS and python-xlib on Linux; Linux panels
# additionally need the system GTK/AppIndicator bindings (see docs/tray.md).
# The optional Activity window uses tkinter from the Python standard library.
tray = [
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
]

# Native Apple Gateway profile. This is for direct macOS Python installs (not
# Docker), because MLX/Metal-backed engines need the host Apple runtime. As the
# deployment entry point, Gateway's `apple` profile installs the full native
# Apple stack and all relevant non-NVIDIA framework capabilities.
apple = [
  "AbstractRuntime[apple]>=0.9.1",
  "abstractagent[apple]>=0.3.19",
  "AbstractMemory[all-apple]>=0.3.0",
]

# Native/container GPU Gateway profile. This is the full local GPU aggregate for
# Python installs and for the NVIDIA Docker image.
gpu = [
  "AbstractRuntime[gpu]>=0.9.1",
  "abstractagent[gpu]>=0.3.19",
  "AbstractMemory[all-gpu]>=0.3.0",
]
dev = [
  "pytest>=7.0.0",
  "httpx>=0.27.0",
  # Hermetic SMTP server for the email tests (abstractcore.testing.mailserver).
  "aiosmtpd>=1.4.4,<2.0.0",
]

docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.0.0",
]

[project.scripts]
abstractgateway = "abstractgateway.cli:main"
abstractgateway-config = "abstractgateway.config_cli:main"

[project.urls]
"GitHub" = "https://github.com/lpalbou/abstractgateway"
"Documentation" = "https://www.lpalbou.info/AbstractGateway/"
"Changelog" = "https://github.com/lpalbou/abstractgateway/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/abstractgateway"]

[tool.hatch.build.targets.wheel.force-include]
"flows/bundles/basic-agent.flow" = "abstractgateway/flows/bundles/basic-agent.flow"
"flows/bundles/abstractassistant-orchestrator@0.0.0.flow" = "abstractgateway/flows/bundles/abstractassistant-orchestrator@0.0.0.flow"
"flows/bundles/deep-research@0.1.8.flow" = "abstractgateway/flows/bundles/deep-research@0.1.8.flow"
# Out-of-box flagship workflows: a fresh install serves a proven coder
# (coding-agent:coder — abstractcode-tui's default agent when installed),
# deep research, and co-scientist without any manual bundle install.
"flows/bundles/coding-agent@0.2.8.flow" = "abstractgateway/flows/bundles/coding-agent@0.2.8.flow"
"flows/bundles/co-scientist@0.2.1.flow" = "abstractgateway/flows/bundles/co-scientist@0.2.1.flow"
# Kept after an upgrade: automations and catalog records pin the concrete version
# they were created with (coding-agent@0.2.6, co-scientist@0.2.0, docs-qa@0.1.0
# shipped in 0.6.0). Removing a shipped version breaks those on upgrade.
"flows/bundles/coding-agent@0.2.6.flow" = "abstractgateway/flows/bundles/coding-agent@0.2.6.flow"
"flows/bundles/co-scientist@0.2.0.flow" = "abstractgateway/flows/bundles/co-scientist@0.2.0.flow"
# The console assistant drawer's transport bundle: boot ensure-publishes it
# into the tenant catalog (shipped_catalog.py, card 013) — the wheel must
# actually carry it or a fresh pip install has nothing to publish.
"flows/bundles/docs-qa@0.1.1.flow" = "abstractgateway/flows/bundles/docs-qa@0.1.1.flow"
"flows/bundles/docs-qa@0.1.2.flow" = "abstractgateway/flows/bundles/docs-qa@0.1.2.flow"
"flows/bundles/docs-qa@0.1.0.flow" = "abstractgateway/flows/bundles/docs-qa@0.1.0.flow"
"flows/bundles/react-agent@0.1.0.flow" = "abstractgateway/flows/bundles/react-agent@0.1.0.flow"
"flows/bundles/codeact-agent@0.1.0.flow" = "abstractgateway/flows/bundles/codeact-agent@0.1.0.flow"
"flows/bundles/memact-agent@0.1.0.flow" = "abstractgateway/flows/bundles/memact-agent@0.1.0.flow"
# One-source corpus packaging: the repo-root llms.txt IS the docs corpus the
# /docs/corpus route serves — force-include avoids a checked-in copy drifting.
"llms.txt" = "abstractgateway/assets/llms.txt"

[tool.hatch.build.targets.sdist]
exclude = [
  "/docs/backlog/**",
  "/console-tui/docs/**",
  "/flows/**",
  "/tests/**",
]

[tool.hatch.build.targets.sdist.force-include]
"flows/bundles/basic-agent.flow" = "flows/bundles/basic-agent.flow"
"flows/bundles/abstractassistant-orchestrator@0.0.0.flow" = "flows/bundles/abstractassistant-orchestrator@0.0.0.flow"
"flows/bundles/deep-research@0.1.8.flow" = "flows/bundles/deep-research@0.1.8.flow"
"flows/bundles/coding-agent@0.2.8.flow" = "flows/bundles/coding-agent@0.2.8.flow"
"flows/bundles/co-scientist@0.2.1.flow" = "flows/bundles/co-scientist@0.2.1.flow"
"flows/bundles/coding-agent@0.2.6.flow" = "flows/bundles/coding-agent@0.2.6.flow"
"flows/bundles/co-scientist@0.2.0.flow" = "flows/bundles/co-scientist@0.2.0.flow"
"flows/bundles/docs-qa@0.1.1.flow" = "flows/bundles/docs-qa@0.1.1.flow"
"flows/bundles/docs-qa@0.1.2.flow" = "flows/bundles/docs-qa@0.1.2.flow"
"flows/bundles/docs-qa@0.1.0.flow" = "flows/bundles/docs-qa@0.1.0.flow"
"flows/bundles/react-agent@0.1.0.flow" = "flows/bundles/react-agent@0.1.0.flow"
"flows/bundles/codeact-agent@0.1.0.flow" = "flows/bundles/codeact-agent@0.1.0.flow"
"flows/bundles/memact-agent@0.1.0.flow" = "flows/bundles/memact-agent@0.1.0.flow"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = "-ra --tb=short --strict-markers --strict-config --disable-warnings -p no:cacheprovider"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
  "basic: Contract and unit tests that should be fast and offline",
  "integration: Local integration tests using real gateway components",
  "e2e: End-to-end tests; external services remain opt-in via environment variables",
]
