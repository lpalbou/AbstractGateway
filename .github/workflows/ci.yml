name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A safety net only: the suite runs in well under 30 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      # Every package a seam mounts (backlog 0972): its routes must be in the route table the
      # authorization contract walks. A seam is covered by CI or it is not shipped.
      - name: Install the seam packages
        run: python -m pip install "abstractnote>=0.2.0"
      - name: Pytest
        env:
          CI_SEAMS_REQUIRED: "abstractnote"
          ABSTRACT_E2E_GATEWAY_SPLIT: "0"
          ABSTRACT_E2E_LMSTUDIO: "0"
          ABSTRACTGATEWAY_EMBEDDING_PROVIDER: "disabled"
        # Serial: a pytest-xdist trial (-n auto --dist loadfile, 2 min locally vs 24) failed
        # intermittently on shared state between workers; see backlog 0945.
        run: python -m pytest --durations=15

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install -U pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install --no-cache-dir -e ".[docs]"
      - name: MkDocs build
        run: mkdocs build -q

  console-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MSRV = console-tui/Cargo.toml `rust-version` (1.87): the crate must
      # keep building on it, not only on the latest stable.
      - uses: dtolnay/rust-toolchain@1.87
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-tui
      - name: Format
        working-directory: console-tui
        run: cargo fmt --check
      - name: Clippy
        working-directory: console-tui
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: MSRV (1.87) check
        working-directory: console-tui
        run: cargo +1.87 check --locked --all-targets
      - name: Test
        working-directory: console-tui
        run: cargo test --locked
      - name: Package
        working-directory: console-tui
        run: cargo package --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/abstractgateway-server/Dockerfile
          push: false
          build-args: |
            ABSTRACTGATEWAY_INSTALL_MODE=local
